{% extends "base.html" %}
{% load static %}

{% block title %}회원가입 - ClassQ{% endblock %}
{% block page_title %}회원가입{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/classq-form.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <section class="classq-card auth-card">
    <h1>회원가입</h1>
    <p class="muted-text">Django 기본 학습용 회원가입 폼 영역입니다.</p>

    <form method="post" class="classq-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username" class="form-label">아이디</label>
        <input id="id_username" name="username" type="text" class="input-field" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="id_password1" class="form-label">비밀번호</label>
        <input id="id_password1" name="password1" type="password" class="input-field" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="id_password2" class="form-label">비밀번호 확인</label>
        <input id="id_password2" name="password2" type="password" class="input-field" autocomplete="new-password">
      </div>
      <button type="submit" class="classq-button classq-button-primary form-wide-button">가입</button>
    </form>

    <p class="auth-switch muted-text">
      이미 계정이 있다면 <a href="{% url 'questions:login' %}" class="classq-link">로그인</a>
    </p>
  </section>
</div>
{% endblock %}
