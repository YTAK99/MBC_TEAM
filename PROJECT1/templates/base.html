{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ClassQ{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/classq-base.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body>

  <header class="topbar">

    <a href="{% url 'questions:home' %}" class="topbar-brand">
      <svg class="brand-mark"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <path d="M8 10h.01"></path>
        <path d="M12 10h.01"></path>
        <path d="M16 10h.01"></path>

      </svg>

      <span>ClassQ</span>
    </a>

    <span class="page-name">
      / {% block page_title %}{% endblock %}
    </span>

    <div class="topbar-actions">

      {% if user.is_authenticated %}

      <span class="muted-text">
        {{ user.username }}
      </span>

      <a href="{% url 'questions:logout' %}"
         class="topbar-login">
         로그아웃
      </a>

      {% else %}

      <a href="{% url 'questions:login' %}"
         class="topbar-login">
         로그인
      </a>

      {% endif %}

    </div>

  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}

</body>
</html>
