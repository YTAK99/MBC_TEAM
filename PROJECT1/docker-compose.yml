services:

  web:
    build: .
    env_file:
      - .env

    volumes:
      - static_volume:/app/staticfiles

    depends_on:
      - db

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: classq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  static_volume: